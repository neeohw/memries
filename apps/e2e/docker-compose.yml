# Isolated E2E stack. Default project is `memries-e2e` (see scripts/stack.mjs).
# Host ports default to the single-instance band (18080). Fan-out overrides via env.

services:
  backend:
    build:
      context: ../..
      dockerfile: Dockerfile.backend
    environment:
      MEMRIES_ADDR: ":8080"
      MEMRIES_DB_DRIVER: sqlite
      MEMRIES_DB_DSN: /data/db/memries.db
      MEMRIES_STORAGE_BACKEND: local
      MEMRIES_LOCAL_ROOT: /data/photos
      MEMRIES_CACHE_ROOT: /data/cache
      # Extra server directories local folders may live under (MEMRIES_LOCAL_ROOT is always allowed).
      MEMRIES_SOURCE_ROOTS: ${SOURCE_ROOTS:-}
      MEMRIES_SESSION_KEY: ${SESSION_KEY}
      # Pinned, NOT read from .env: apps/e2e/steps/fixtures.ts signs in with
      # this exact literal, so a developer's own BOOTSTRAP_PASSWORD must not
      # reach this disposable stack (ADR 0016).
      MEMRIES_BOOTSTRAP_PASSWORD: password
      # Likewise pinned, so the bootstrapped account is the one the suite uses.
      MEMRIES_ADMIN_EMAILS: admin@example.com
      MEMRIES_PUBLIC_URL: http://localhost:${CADDY_HOST_PORT:-18080}
      MEMRIES_E2E: "1"
    volumes:
      - ./.work/photos:/data/photos
      - ./.work/cache:/data/cache
      - ./.work/db:/data/db
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-18081}:8080"

  frontend:
    build:
      context: ../..
      dockerfile: Dockerfile.frontend
    environment:
      VITE_API_BASE: http://localhost:${CADDY_HOST_PORT:-18080}
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-15173}:80"

  caddy:
    image: caddy:2.8-alpine
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_e2e_data:/data
      - caddy_e2e_config:/config
    ports:
      - "127.0.0.1:${CADDY_HOST_PORT:-18080}:80"
    depends_on:
      - backend
      - frontend

volumes:
  caddy_e2e_data:
  caddy_e2e_config:
