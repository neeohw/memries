# Isolated E2E stack. Default project is `memries-e2e` (see scripts/stack.mjs).
# Host ports default to the single-instance band (18080). Fan-out overrides via env.

services:
  backend:
    build:
      context: ../..
      dockerfile: Dockerfile.backend
    volumes:
      # Written per run by scripts/stack.mjs: the public URL depends on the
      # port this run leased, and the server reads one YAML file and nothing
      # else (ADR 0028). The session key, bootstrap password and admin list
      # are pinned in there, so a developer's own secrets never reach this
      # disposable stack (ADR 0012, ADR 0016).
      - ./.work/memries.yaml:/etc/memries/config.yaml:ro
      - ./.work/photos:/data/photos
      - ./.work/cache:/data/cache
      - ./.work/db:/data/db
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-18081}:8080"

  frontend:
    build:
      context: ../..
      dockerfile: Dockerfile.frontend
    environment:
      VITE_API_BASE: http://localhost:${CADDY_HOST_PORT:-18080}
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-15173}:80"

  caddy:
    image: caddy:2.8-alpine
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_e2e_data:/data
      - caddy_e2e_config:/config
    ports:
      - "127.0.0.1:${CADDY_HOST_PORT:-18080}:80"
    depends_on:
      - backend
      - frontend

volumes:
  caddy_e2e_data:
  caddy_e2e_config:
