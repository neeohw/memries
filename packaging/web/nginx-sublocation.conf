# Memries under a sublocation of a site you already serve (ADR 0030).
#
# Use this when the box's web server is already busy on :80 and you want the
# library at, say, http://your-box/memries/ rather than on a port of its own.
# Paste the three blocks into that site's existing `server { ... }`:
#
#   $EDITOR /etc/nginx/sites-available/default      # or whichever site it is
#   nginx -t && systemctl reload nginx
#
# Then set public_url in /etc/memries/config.yaml to the origin the browser
# uses — the scheme and host only, no path: http://your-box
#
# The app works out that it lives under /memries/ from the URL its own
# index.html was served from, so nothing here has to be compiled into it and
# one package works at any mount point. Pick a different prefix and the only
# thing to change is the three /memries/ below — all three, including the
# proxy_pass paths, which strip the prefix back off before the API sees it.

# Without the trailing slash the browser would resolve the app's relative
# asset URLs against the parent directory, so send it to the real mount point
# before any of that can happen.
location = /memries {
    return 301 /memries/;
}

# Content-hashed filenames, so they can be cached for ever. This comes first
# because nginx prefers a regular-expression location over a prefix one, and
# it captures the rest of the path so `alias` can rebuild the real one.
location ~ ^/memries/assets/(.+)$ {
    alias /usr/share/memries/www/assets/$1;
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
}

# The built interface. `alias` rather than `root`: the files are not under a
# directory named /memries on disk. Everything that is not a file is
# index.html, because the app owns what it shows.
#
# index.html itself must never be cached, or a deploy leaves browsers on an
# old bundle asking for hashed assets that are gone. Only index.html reaches
# this block — the assets are taken by the regex above — so the header can
# simply live here.
location /memries/ {
    alias /usr/share/memries/www/;
    index index.html;
    try_files $uri $uri/ /memries/index.html;
    add_header Cache-Control "no-cache";
}

# The API and sign-in. /auth sits outside /api deliberately — the session
# middleware guards /api, and you cannot present a session in order to get
# one — so both are named, and the trailing slash on proxy_pass is what
# strips /memries/ before the request reaches the service.
location ~ ^/memries/(api|auth)/ {
    rewrite ^/memries/(.*)$ /$1 break;
    proxy_pass http://127.0.0.1:5987;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Originals stream with byte ranges and run to hundreds of megabytes
    # (ADR 0029); buffering one to disk would stall every seek.
    proxy_buffering off;
    proxy_request_buffering off;
    client_max_body_size 0;
    proxy_read_timeout 300s;
    send_timeout 300s;
}
