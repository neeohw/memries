# Memries behind Apache. See nginx.conf for why the API must share the SPA's
# origin, and why this listens on a port of its own rather than competing for
# :80 with whatever else this machine serves (ADR 0030).
#
#   a2enmod proxy proxy_http headers
#   cp /usr/share/memries/apache.conf /etc/apache2/sites-available/memries.conf
#   echo "Listen 5988" | sudo tee /etc/apache2/conf-available/memries-port.conf
#   a2enconf memries-port && a2ensite memries
#   apachectl configtest && systemctl reload apache2
#
# Apache will not listen on a port no Listen directive names, which is why
# the conf-available line above is not optional.

<VirtualHost *:5988>
    ServerName memries

    DocumentRoot /usr/share/memries/www

    <Directory /usr/share/memries/www>
        Require all granted
        Options -Indexes
        # The SPA owns its routes: anything that is not a file is index.html.
        FallbackResource /index.html
    </Directory>

    # Content-hashed filenames, so cache them for ever; index.html never.
    <LocationMatch "^/assets/">
        Header set Cache-Control "public, immutable, max-age=31536000"
    </LocationMatch>
    <Location "/index.html">
        Header set Cache-Control "no-cache"
    </Location>

    # /auth is outside /api on purpose, so both are named.
    ProxyPreserveHost On
    ProxyPass /api/ http://127.0.0.1:5987/api/ timeout=300
    ProxyPassReverse /api/ http://127.0.0.1:5987/api/
    ProxyPass /auth/ http://127.0.0.1:5987/auth/ timeout=300
    ProxyPassReverse /auth/ http://127.0.0.1:5987/auth/

    # Originals stream with byte ranges; do not hold them in a buffer.
    SetEnv proxy-sendchunked 1
    SetEnv proxy-nokeepalive 0
</VirtualHost>
