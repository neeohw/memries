# Memries behind nginx.
#
# The SPA calls /api and /auth with relative paths, so whatever origin serves
# the HTML must also serve those. That is this file's whole job, and it is
# why the frontend never needs to be told the backend's port (ADR 0030).
#
# The session cookie is SameSite=Lax, so a frontend on a different origin
# would sign in and immediately look signed out. Same-origin is not a
# preference here.
#
#   cp /usr/share/memries/nginx.conf /etc/nginx/sites-available/memries
#   ln -s /etc/nginx/sites-available/memries /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# It listens on 5988, a port of its own, and touches nothing you already
# serve. That is deliberate: a box that runs a photo library usually runs
# other things, and a vhost on :80 matching `server_name _` would compete for
# every request that arrives by IP address — which is how you end up being
# told to delete somebody else's site. Installing this must not do that.
#
# Two alternatives, if you would rather it were on :80:
#
#   * Give it a name. Set `server_name photos.example.lan`, point DNS or
#     /etc/hosts at this machine, change the listen lines to 80, and browse
#     by that name. Requests by bare IP still go to whatever is default,
#     because an address matches no name.
#
#   * Make it the default, if nothing else already is. Add `default_server`
#     to the listen lines. Only one site may carry it; two and nginx refuses
#     to start, which `nginx -t` will tell you before a reload does.
#
# Either way, keep public_url in /etc/memries/config.yaml equal to the origin
# the browser actually uses, port and all: it is the CORS allow-list and it
# decides whether the session cookie is marked Secure.

server {
    listen 5988;
    listen [::]:5988;
    server_name _;

    root /usr/share/memries/www;
    index index.html;

    # The SPA owns its routes: anything that is not a file is index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite writes content-hashed filenames, so these can be cached for ever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must not be cached, or a deploy leaves browsers on the old
    # bundle pointing at hashed assets that no longer exist.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Sign-in lives outside /api deliberately — the session middleware guards
    # /api, and you cannot present a session in order to get one — so it
    # needs naming here too.
    location ~ ^/(api|auth)/ {
        proxy_pass http://127.0.0.1:5987;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Originals are streamed with byte ranges and run to hundreds of
        # megabytes (ADR 0029). Buffering one to disk before sending a byte
        # would stall every seek and fill the card.
        proxy_buffering off;
        proxy_request_buffering off;
        client_max_body_size 0;
        proxy_read_timeout 300s;
        send_timeout 300s;
    }
}
