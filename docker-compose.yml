services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      MEMRIES_ADDR: ":8080"
      # sqlite (default) or postgres (ADR 0014).
      MEMRIES_DB_DRIVER: ${DB_DRIVER:-sqlite}
      MEMRIES_DB_DSN: ${DB_DSN:-/data/db/memries.db}
      MEMRIES_STORAGE_BACKEND: local
      MEMRIES_LOCAL_ROOT: /data/photos
      MEMRIES_CACHE_ROOT: /data/cache
      # Folders an admin may move the thumbnail cache to (ADR 0022). Mount the
      # host directory into this container as well, or the server cannot
      # write there.
      MEMRIES_CACHE_ROOTS: ${CACHE_ROOTS:-}
      # Soft heap ceiling for the Go runtime (ADR 0015). Peak RSS measured at
      # 230MiB with 4 index workers on 12MP frames, so this caps runaway GC
      # growth with room to spare instead of letting the heap double freely.
      GOMEMLIMIT: ${GOMEMLIMIT:-512MiB}
      # Who may add/remove indexed folders (comma-separated emails).
      MEMRIES_ADMIN_EMAILS: ${ADMIN_EMAILS:-admin@example.com}
      # Extra server directories local folders may live under (MEMRIES_LOCAL_ROOT is always allowed).
      MEMRIES_SOURCE_ROOTS: ${SOURCE_ROOTS:-}
      MEMRIES_SESSION_KEY: ${SESSION_KEY}
      # Gives the MEMRIES_ADMIN_EMAILS accounts a password on a fresh install
      # (ADR 0016). It only ever fills an empty password, so leaving it set
      # here does not undo a later change.
      MEMRIES_BOOTSTRAP_PASSWORD: ${BOOTSTRAP_PASSWORD}
      MEMRIES_PUBLIC_URL: http://localhost
    volumes:
      - ./data/photos:/data/photos
      - ./data/cache:/data/cache
      - ./data/db:/data/db
    ports:
      - "127.0.0.1:8080:8080"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    environment:
      VITE_API_BASE: http://localhost
    ports:
      - "127.0.0.1:5173:80"

  caddy:
    image: caddy:2.8-alpine
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
    depends_on:
      - backend
      - frontend

volumes:
  caddy_data:
  caddy_config:
