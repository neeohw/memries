services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      # Soft heap ceiling for the Go runtime (ADR 0015). Peak RSS measured at
      # 230MiB with 4 index workers on 12MP frames, so this caps runaway GC
      # growth with room to spare instead of letting the heap double freely.
      # Not server configuration: that all lives in memries.yaml (ADR 0028).
      GOMEMLIMIT: ${GOMEMLIMIT:-512MiB}
    volumes:
      # The whole server configuration, at the path the binary looks in last
      # so no flag is needed. Copy memries.example.yaml to memries.yaml first.
      - ./memries.yaml:/etc/memries/config.yaml:ro
      - ./data/photos:/data/photos
      - ./data/cache:/data/cache
      - ./data/db:/data/db
    ports:
      - "127.0.0.1:8080:8080"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    environment:
      VITE_API_BASE: http://localhost
    ports:
      - "127.0.0.1:5173:80"

  caddy:
    image: caddy:2.8-alpine
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
    depends_on:
      - backend
      - frontend

volumes:
  caddy_data:
  caddy_config:
